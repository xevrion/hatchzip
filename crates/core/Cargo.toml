[package]
name = "hatchzip-core"
description = "The engine behind HatchZip: extract ZIP, 7z and tar archives in place, freeing the archive as it goes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["zip", "7z", "extract", "archive", "disk-space"]
categories = ["compression", "filesystem"]

[dependencies]
anyhow.workspace = true
crc32fast = "1.5.3"
fs4 = "1.1.0"
# Pure Rust zlib with the C API, for inflatePrime, inflateSetDictionary and
# Z_BLOCK, which resuming a deflate stream mid-way needs and the safe
# wrappers don't expose. Its zlib-rs core is already flate2's backend here.
libz-rs-sys = "0.6.8"
rayon = "1.12.0"
serde.workspace = true
serde_json.workspace = true
sevenz-rust2.workspace = true
tar.workspace = true
# The UnRAR decoder, bound without the safe wrapper: it needs the data
# callback, which the safe crates don't expose. The bindings are MIT or
# Apache; the UnRAR C++ source they build is under its own license, see
# LICENSE-UNRAR and docs/formats.md. Pinned, since a new version brings new
# vendored C++.
unrar-ng-sys = { version = "=0.7.7", optional = true }
# The RAR 5 password check value and header key, PBKDF2-HMAC-SHA256, and
# AES-CBC for encrypted RAR headers; all already in the tree through zip and
# sevenz-rust2.
aes = { version = "0.9.3", optional = true }
cbc = { version = "0.2.1", optional = true }
pbkdf2 = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
zip.workspace = true

[features]
# RAR archives, decoded by UnRAR. Off by default: without it the build is
# open source throughout and needs no C++ compiler, and a RAR archive is
# refused before anything is touched. The release builds turn it on.
rar = ["dep:unrar-ng-sys", "dep:aes", "dep:cbc", "dep:pbkdf2", "dep:sha2"]

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
