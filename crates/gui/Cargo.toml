[package]
name = "hatchzip-gui"
description = "The HatchZip desktop app: extract huge archives in place, freeing the archive as it goes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
hatchzip-core.workspace = true
hatchzip-shell = { path = "../shell" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
open = "5.4.5"
# Decodes the window icon; already in the tree through Slint's build.
png = "0.18.1"
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
# The system's preferred languages, in order, to pick a translation from
# (src/locale.rs). Already in the tree through Slint.
sys-locale = "0.3.2"
# No Qt backend: winit with FemtoVG (OpenGL) first and the software renderer
# as the fallback for machines without a working GPU driver. `~1.18` because
# `unstable-winit-030`, needed for files dropped on the window, may change in
# any minor release.
slint = { version = "~1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-path",
    "raw-window-handle-06",
    "unstable-winit-030",
] }

# Receives the files Finder opens with HatchZip; already in the tree through
# winit, at the same versions.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSURL"] }

[features]
# RAR archives, through UnRAR's C++ source and its own license; see
# hatchzip-core. Off by default, on in the release builds.
rar = ["hatchzip-core/rar", "hatchzip-shell/rar"]

[build-dependencies]
slint-build = "~1.18.1"
# Only used when the target is Windows; see build.rs.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# Drives the real windows headlessly, drawn by the software renderer. Must
# match the version `slint` pins its internals to.
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
tempfile.workspace = true
zip.workspace = true
