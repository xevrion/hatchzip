[package]
name = "hatchzip"
description = "Extract huge archives in place: the archive shrinks as your files hatch, so you only need room for the output."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["zip", "extract", "archive", "unzip", "disk-space"]
categories = ["command-line-utilities", "compression", "filesystem"]

[dependencies]
hatchzip-core.workspace = true
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ctrlc = "3.5.2"
indicatif = "0.18.6"
rpassword = "7.5.4"

[features]
# RAR archives, through UnRAR's C++ source and its own license; see
# hatchzip-core. Off by default, on in the release builds.
rar = ["hatchzip-core/rar"]

[build-dependencies]
# Only used when the target is Windows; see build.rs.
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
# Writes the .tar.gz test archives and the RAR 4 volumes; already in the tree.
crc32fast = "1.5.3"
flate2 = "1.1.10"
# Writes the .tar.xz test archives, same crate the format decodes with.
# The tests need the encoder and the xz container half; core does not.
lzma-rust2 = { version = "0.23.0", default-features = false, features = [
    "std",
    "optimization",
    "encoder",
    "xz",
] }
serde_json.workspace = true
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress"] }
tar.workspace = true
tempfile.workspace = true
zip.workspace = true
