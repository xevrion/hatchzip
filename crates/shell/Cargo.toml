[package]
name = "hatchzip-shell"
description = "Adds HatchZip to the file manager's right-click menu on Windows and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
# Puts the menu on RAR archives too. Only for builds that can extract them.
rar = []

[dependencies]
anyhow.workspace = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
# Only to check that the Explorer menu names the same folder the GUI does.
hatchzip-core.workspace = true
tempfile.workspace = true

[target."cfg(windows)".dev-dependencies]
winreg = "0.56.0"
