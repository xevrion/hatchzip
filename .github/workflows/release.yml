name: release

# Pushing a tag like v0.1.0 builds every download and publishes them as a
# GitHub release. install.sh, install.ps1 and the website link to the latest
# one, so file names never change between versions.
#
# Run by hand on a branch, it's a dry run: everything is built and smoke
# tested, but nothing is published. Run by hand on a tag, it publishes the
# files that release is missing, built by that tag's own copy of this
# workflow. Files a release already has are never replaced, so a published
# download can't change after people have checked it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Static musl binaries: one file that runs on any distribution, old or new.
  # Every release build has the `rar` feature: UnRAR's C++ source, under its
  # own license, which goes into every download as LICENSE-UNRAR.
  #
  # UnRAR is C++ and zstd is C, so both are compiled for musl, and the
  # program links a libstdc++ built for musl, statically. musl-tools has no
  # C++ compiler, and the system's g++ would link glibc's libstdc++, which
  # fails. So each architecture gets a musl cross toolchain (GCC 16.2,
  # musl-cross-make), fetched at a fixed release and checked against its
  # SHA-256, and cc-rs and rustc are pointed at it. The toolchains run on
  # x86_64 only, so both architectures are built here and the aarch64 one is
  # smoke tested under qemu, then again natively on Arm in `linux-arm`.
  linux:
    name: linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            toolchain-sha256: faeaf3c7c377cb4351490988d9a1c8fed7d403a5b8066e5103af5d4dd96450fe
            run: ''
          - arch: aarch64
            toolchain-sha256: 7bf54ef24ecbca3f418e6b74ddc055e3a23b2cbf31ffc0b9a25775189df344ad
            run: qemu-aarch64-static
    env:
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
      MUSL_CROSS: '20261001'
      # Runs a binary of the target architecture on this machine.
      RUN: ${{ matrix.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: musl toolchain
        run: |
          curl -fsSL --proto '=https' -o musl.tar.xz \
            "https://github.com/cross-tools/musl-cross/releases/download/$MUSL_CROSS/$TARGET.tar.xz"
          echo "${{ matrix.toolchain-sha256 }}  musl.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/musl"
          tar -xJf musl.tar.xz -C "$RUNNER_TEMP/musl"
          rm musl.tar.xz
          echo "$RUNNER_TEMP/musl/$TARGET/bin" >> "$GITHUB_PATH"
      - name: qemu
        if: matrix.run != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static
      - name: build
        run: |
          rustup target add "$TARGET"
          t="${TARGET//-/_}"
          export "CC_$t=$TARGET-gcc" "CXX_$t=$TARGET-g++" "AR_$t=$TARGET-ar"
          export "CARGO_TARGET_${t^^}_LINKER=$TARGET-gcc"
          cargo build --release --locked -p hatchzip --features rar --target "$TARGET"
      - name: check it is static
        run: file "target/$TARGET/release/hatchzip" | tee /dev/stderr | grep -q "static"
      - name: smoke test
        run: python3 .github/scripts/smoke.py $RUN "target/$TARGET/release/hatchzip"
      - name: package
        run: |
          bin="target/$TARGET/release/hatchzip"
          name="hatchzip-${{ matrix.arch }}-linux"
          mkdir -p "dist/$name/completions" "dist/$name/man"
          cp "$bin" LICENSE-MIT LICENSE-APACHE LICENSE-UNRAR README.md "dist/$name/"
          $RUN "$bin" completions bash > "dist/$name/completions/hatchzip.bash"
          $RUN "$bin" completions zsh > "dist/$name/completions/_hatchzip"
          $RUN "$bin" completions fish > "dist/$name/completions/hatchzip.fish"
          $RUN "$bin" man > "dist/$name/man/hatchzip.1"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  # The aarch64 build, cross compiled above, run on real Arm hardware before
  # anything is published.
  linux-arm:
    name: linux aarch64 on arm
    needs: linux
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-aarch64
          path: cli
      - name: smoke test
        run: |
          (cd cli && sha256sum -c hatchzip-aarch64-linux.tar.gz.sha256)
          tar -xzf cli/hatchzip-aarch64-linux.tar.gz -C cli
          test -s cli/hatchzip-aarch64-linux/LICENSE-UNRAR
          python3 .github/scripts/smoke.py cli/hatchzip-aarch64-linux/hatchzip

  # The CLI zip, the Inno setup and the MSI, each installed, run and
  # uninstalled on the runner. With signing set up (see "Windows: signing"
  # in packaging/README.md), the programs are signed before they're packaged
  # and the two installers after they're built; without it, those steps are
  # skipped.
  windows:
    name: windows x86_64
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      # SignPath downloads the files to sign from this run's artifacts.
      actions: read
    env:
      # The signing service: SignPath if its token is set, else Azure
      # Artifact Signing if its secret is, else none. Dry runs are signed
      # only when the variable SIGN_DRY_RUNS is true, since a signing policy
      # may wait for a person to approve each request.
      SIGNER: ${{ (startsWith(github.ref, 'refs/tags/') || vars.SIGN_DRY_RUNS == 'true') && ((secrets.SIGNPATH_API_TOKEN != '' && 'signpath') || (secrets.AZURE_CLIENT_SECRET != '' && 'azure')) || '' }}
      # SignPath's test certificate is self-signed, so Windows doesn't trust
      # it. A dry run signed with it is still checked; a tag never is, so a
      # release can't ship with it.
      TEST_CERTIFICATE: ${{ !startsWith(github.ref, 'refs/tags/') && vars.SIGNPATH_SIGNING_POLICY_SLUG == 'test-signing' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .cargo/config.toml links the C runtime in, so no redistributable is
      # needed; cc-rs sees crt-static and builds UnRAR with /MT to match.
      - name: build
        run: cargo build --release --locked -p hatchzip -p hatchzip-gui --features rar
      - name: signing
        run: |
          echo "signing with ${SIGNER:-nothing, signing is not set up for this run}"
          echo "HATCHZIP_VERSION=$(target/release/hatchzip.exe --version | awk '{print $2}')" >> "$GITHUB_ENV"
      # The setup's uninstaller is signed with the programs: Inno Setup writes
      # it unsigned here and embeds the signed copy when the setup is built
      # (see build-setup.ps1).
      - name: prepare the uninstaller
        if: env.SIGNER != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/prepare | Out-Null
          Copy-Item target/release/hatchzip.exe, target/release/hatchzip-gui.exe dist/prepare/
          packaging/windows/build-setup.ps1 dist/prepare $env:HATCHZIP_VERSION -SignedUninstallerDir dist/uninstaller -Prepare

      # Sign the programs and the uninstaller, under a fixed name so the
      # artifact configuration can list it. hz.exe is a copy of hatchzip.exe,
      # made when packaging.
      - name: stage the programs for signing
        if: env.SIGNER != ''
        run: |
          mkdir signing-programs
          cp target/release/hatchzip.exe target/release/hatchzip-gui.exe signing-programs/
          cp dist/uninstaller/uninst-*.e32 signing-programs/uninstaller.exe
      - id: unsigned-programs
        if: env.SIGNER == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-programs
          path: signing-programs/
          if-no-files-found: error
          retention-days: 1
      - name: sign the programs (SignPath)
        if: env.SIGNER == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.unsigned-programs.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-programs
      - name: sign the programs (Azure Artifact Signing)
        if: env.SIGNER == 'azure'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\signing-programs
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: use the signed programs
        if: env.SIGNER != ''
        shell: pwsh
        # SignPath returns the signed files; Azure signs them where they are.
        run: |
          $signed = '${{ env.SIGNER == 'signpath' && 'signed-programs' || 'signing-programs' }}'
          packaging/windows/check-signed.ps1 $signed target/release hatchzip.exe hatchzip-gui.exe
          $uninstaller = (Get-ChildItem dist/uninstaller -Filter 'uninst-*.e32').FullName
          packaging/windows/check-signed.ps1 $signed dist/uninstaller uninstaller.exe
          Move-Item -Force dist/uninstaller/uninstaller.exe $uninstaller

      - name: smoke test
        run: python .github/scripts/smoke.py target/release/hatchzip.exe
      - name: no networking
        run: python .github/scripts/no-network.py target/release/hatchzip.exe target/release/hatchzip-gui.exe
      - name: package
        run: |
          name="hatchzip-x86_64-windows"
          mkdir -p "dist/$name"
          cp target/release/hatchzip.exe "dist/$name/"
          cp LICENSE-MIT "dist/$name/LICENSE-MIT.txt"
          cp LICENSE-APACHE "dist/$name/LICENSE-APACHE.txt"
          cp LICENSE-UNRAR "dist/$name/LICENSE-UNRAR.txt"
          cp README.md "dist/$name/README.md"
          target/release/hatchzip.exe completions powershell > "dist/$name/hatchzip-completion.ps1"
          (cd "dist/$name" && 7z a -tzip "../$name.zip" . > /dev/null)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
      # The setup and the MSI hold what the zip holds, plus the desktop app.
      - name: stage the installers
        run: |
          mkdir -p dist/payload
          cp -r dist/hatchzip-x86_64-windows/. dist/payload/
          cp target/release/hatchzip-gui.exe dist/payload/
      # The same files with nothing to install: unzip anywhere and run
      # hatchzip-gui.exe. Settings, "Show in the Explorer context menu" adds
      # the right-click entries for wherever it is, and removes them again.
      - name: portable zip
        run: |
          (cd dist/payload && 7z a -tzip ../HatchZip-x64-portable.zip . > /dev/null)
          (cd dist && sha256sum HatchZip-x64-portable.zip > HatchZip-x64-portable.zip.sha256)
      - name: build the setup
        shell: pwsh
        run: |
          $signed = if ($env:SIGNER) { @{ SignedUninstallerDir = 'dist/uninstaller' } } else { @{} }
          packaging/windows/build-setup.ps1 dist/payload $env:HATCHZIP_VERSION @signed
      - name: build the MSI
        shell: pwsh
        run: packaging/windows/build-msi.ps1 dist/payload $env:HATCHZIP_VERSION

      # Sign the installers, then test what was signed.
      - name: stage the installers for signing
        if: env.SIGNER != ''
        run: mkdir signing-installers && cp dist/HatchZip-x64-setup.exe dist/HatchZip-x64.msi signing-installers/
      - id: unsigned-installers
        if: env.SIGNER == 'signpath'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-installers
          path: signing-installers/
          if-no-files-found: error
          retention-days: 1
      - name: sign the installers (SignPath)
        if: env.SIGNER == 'signpath'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers
      - name: sign the installers (Azure Artifact Signing)
        if: env.SIGNER == 'azure'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\signing-installers
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: use the signed installers
        if: env.SIGNER != ''
        shell: pwsh
        run: packaging/windows/check-signed.ps1 ${{ env.SIGNER == 'signpath' && 'signed-installers' || 'signing-installers' }} dist HatchZip-x64-setup.exe HatchZip-x64.msi

      - name: install, run and uninstall the setup
        shell: pwsh
        run: packaging/windows/test-setup.ps1 dist/HatchZip-x64-setup.exe
      - name: install, run and uninstall the MSI
        shell: pwsh
        run: packaging/windows/test-msi.ps1 dist/HatchZip-x64.msi dist/HatchZip-x64-setup.exe
      - name: checksum the installers
        run: |
          cd dist
          for f in HatchZip-x64-setup.exe HatchZip-x64.msi; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64
          path: |
            dist/*.zip*
            dist/HatchZip-x64-setup.exe*
            dist/HatchZip-x64.msi*
          if-no-files-found: error

  # Both Mac architectures from one Apple Silicon runner. Only the native one
  # can be smoke tested; the Intel build is checked to be the right kind of file.
  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p hatchzip -p hatchzip-gui --features rar --target aarch64-apple-darwin
          cargo build --release --locked -p hatchzip -p hatchzip-gui --features rar --target x86_64-apple-darwin
          file target/x86_64-apple-darwin/release/hatchzip | grep -q x86_64
          file target/x86_64-apple-darwin/release/hatchzip-gui | grep -q x86_64
      - name: smoke test
        run: python3 .github/scripts/smoke.py target/aarch64-apple-darwin/release/hatchzip
      - name: no networking
        run: python3 .github/scripts/no-network.py target/*-apple-darwin/release/hatchzip target/*-apple-darwin/release/hatchzip-gui
      - name: package
        run: |
          native=target/aarch64-apple-darwin/release/hatchzip
          for arch in aarch64 x86_64; do
            name="hatchzip-$arch-macos"
            mkdir -p "dist/$name/completions" "dist/$name/man"
            cp "target/$arch-apple-darwin/release/hatchzip" LICENSE-MIT LICENSE-APACHE LICENSE-UNRAR README.md "dist/$name/"
            "$native" completions bash > "dist/$name/completions/hatchzip.bash"
            "$native" completions zsh > "dist/$name/completions/_hatchzip"
            "$native" completions fish > "dist/$name/completions/hatchzip.fish"
            "$native" man > "dist/$name/man/hatchzip.1"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          done
      # HatchZip.app in a dmg per architecture, with the CLI from the folder
      # the tarball was made from inside it.
      - name: dmg
        run: |
          for arch in aarch64 x86_64; do
            sh packaging/macos/build-dmg.sh "$arch" "target/$arch-apple-darwin/release/hatchzip-gui" "dist/hatchzip-$arch-macos"
          done
      - name: open the dmg and run the app
        run: sh packaging/macos/test-dmg.sh dist/HatchZip-aarch64.dmg
      - name: checksum the dmgs
        run: |
          cd dist
          for arch in aarch64 x86_64; do
            shasum -a 256 "HatchZip-$arch.dmg" > "HatchZip-$arch.dmg.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            dist/*.tar.gz*
            dist/HatchZip-*.dmg*
          if-no-files-found: error

  # .deb, .rpm and AppImage of the desktop app, x86_64 only for now. A job of
  # its own because the app can't be a static musl build like the CLI: it
  # links the C library and fontconfig of the system it's built on and runs
  # on that version or newer, so this uses the oldest Ubuntu runner. The CLI
  # in the packages is the static one from the linux job.
  linux-packages:
    name: linux packages
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      NFPM_VERSION: 2.48.0
      NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app links fontconfig; everything else Slint needs is loaded at
      # run time.
      - name: packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev
      - name: build
        run: cargo build --release --locked -p hatchzip-gui --features rar
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x86_64
          path: cli
      - name: stage
        run: |
          tar -xzf cli/hatchzip-x86_64-linux.tar.gz -C cli
          cli=cli/hatchzip-x86_64-linux/hatchzip
          mkdir -p dist/pkg/completions
          cp "$cli" target/release/hatchzip-gui dist/pkg/
          "$cli" man | gzip -9n > dist/pkg/hatchzip.1.gz
          "$cli" completions bash > dist/pkg/completions/hatchzip.bash
          "$cli" completions zsh > dist/pkg/completions/_hatchzip
          "$cli" completions fish > dist/pkg/completions/hatchzip.fish
          echo "HATCHZIP_VERSION=$("$cli" --version | awk '{print $2}')" >> "$GITHUB_ENV"
      - name: deb and rpm
        run: |
          curl -fsSL --proto '=https' -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz nfpm
          ./nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/hatchzip_amd64.deb
          ./nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/hatchzip-x86_64.rpm
      - name: AppImage
        run: sh packaging/linux/build-appimage.sh target/release/hatchzip-gui
      - name: install and run each package
        run: sh packaging/linux/test-packages.sh
      - name: checksums
        run: |
          cd dist
          for f in hatchzip_amd64.deb hatchzip-x86_64.rpm HatchZip-x86_64.AppImage; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            dist/hatchzip_amd64.deb*
            dist/hatchzip-x86_64.rpm*
            dist/HatchZip-x86_64.AppImage*
          if-no-files-found: error

  publish:
    needs: [linux, linux-arm, windows, macos, linux-packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Signed build provenance: anyone can check that a download was built
      # by this workflow from this repository, with
      # `gh attestation verify <file> --repo xevrion/hatchzip`. A copy served
      # from anywhere else, altered in any way, fails that check.
      id-token: write
      attestations: write
    steps:
      # Every download, but not the signing-* artifacts the Windows job
      # hands to SignPath, which hold unsigned copies. A new job's artifact
      # has to be added here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '{linux-*,windows-*,macos,linux-packages}'
          merge-multiple: true
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          # The provenance as a file next to the downloads too, for checking
          # offline: gh attestation verify <file> --bundle <it> --repo xevrion/hatchzip
          cp "$BUNDLE" "dist/hatchzip-$TAG.intoto.jsonl"
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            for f in dist/*; do
              if grep -qxF "$(basename "$f")" <<< "$have"; then
                echo "kept: $(basename "$f") is already published"
              else
                gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$TAG" dist/* --generate-notes --title "HatchZip $TAG" --repo "$GITHUB_REPOSITORY"
          fi
      # The AUR, winget, Homebrew and Scoop manifests for this release,
      # rewritten from the .sha256 files above and uploaded as an artifact to
      # review. Nothing is pushed or submitted: that stays manual, see
      # "Package managers" in packaging/README.md. Checked out into its own
      # folder so the checkout can't clean dist/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src
      - name: package manager manifests
        env:
          TAG: ${{ github.ref_name }}
        run: python3 src/packaging/update-manifests.py "$TAG" --sha256-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifests
          path: |
            src/packaging/aur
            src/packaging/homebrew
            src/packaging/scoop
            src/packaging/winget
          if-no-files-found: error
