name: scorecard

# OpenSSF Scorecard: checks the repository's own supply-chain practices
# (pinned actions, token permissions, branch protection, signed releases and
# so on), publishes the score behind the README badge, and lists findings
# under Security, Code scanning. Based on the official template; publishing
# requires the job to stay this plain: no `run` steps, no top-level env, only
# the actions below.
on:
  # Re-scores when the branch protection rules change.
  branch_protection_rule:
  schedule:
    - cron: '23 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for exactly what it needs below.
permissions: {}

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Uploads the findings to code scanning.
      security-events: write
      # Signs the published results, so the badge can be trusted.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
