name: ci

on:
  # main only. Every other branch is checked through its pull request, so
  # listening to all pushes would run dependabot's branches twice.
  push:
    branches: [main]
    # Pushes that only touch docs don't start a runner at all. Pull requests
    # still always run, since `ci result` is a required check there and a
    # skipped workflow would leave it waiting.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Reading the code is all any job here needs.
permissions:
  contents: read

# A new push to the same branch makes the running checks for the old one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is on the runner, rust-toolchain.toml picks the version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The GUI links fontconfig; everything else Slint needs is loaded at
      # run time.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - run: cargo fmt --all --check
      # With and without RAR support, which compiles different code.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --features rar -- -D warnings

  # Truncation, free space checks and file renames all behave differently per
  # OS and filesystem, so the tests run on all three. It waits for the quick
  # check: on a private repo macOS minutes bill at ten times the Linux rate,
  # and a formatting slip shouldn't pay for them.
  #
  # With RAR support on every system, as the releases are built, and on
  # Linux without it too, as `cargo install` and distributions build it.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features || 'no rar' }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One OS failing says nothing about the others, so let them all finish.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        features: [rar]
        include:
          - os: ubuntu-24.04
            features: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      # The crash tests abort a child process midway on purpose and then
      # resume it, so an abort message in the log is expected, not a failure.
      # Every suite runs even after one fails, so a platform bug shows all
      # its symptoms in one run instead of one per push.
      # The runners' disks (ext4, APFS, NTFS) all free punched space, so the
      # punch test must see it happen rather than skip.
      - run: cargo test --workspace --locked --no-fail-fast --features "$FEATURES"
        shell: bash
        env:
          HATCHZIP_EXPECT_PUNCH: '1'
          FEATURES: ${{ matrix.features }}
      # The quick check lints Linux only; code behind `cfg(windows)` and
      # `cfg(target_os = "macos")`, and test helpers only Unix tests use,
      # get linted here.
      - if: runner.os != 'Linux'
        run: cargo clippy --workspace --all-targets --locked --features "$FEATURES" -- -D warnings
        shell: bash
        env:
          FEATURES: ${{ matrix.features }}

  # deny.toml: known vulnerabilities (RustSec), licenses, crates.io as the only
  # source, and the network ban list, which fails if an HTTP, TLS or socket
  # crate ever enters the dependency tree. With and without RAR, since the
  # feature changes the tree. Reads Cargo.lock only, nothing is compiled.
  deny:
    name: cargo deny (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no rar
            arguments: --locked
          - name: rar
            arguments: --locked --features rar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: ${{ matrix.arguments }}
          command-arguments: --hide-inclusion-graph

  # The one check branch protection requires, so adding or renaming a job
  # above never means editing the protection rules. This passes when
  # everything that ran passed, and treats skipped as fine.
  result:
    name: ci result
    if: always()
    needs: [check, test, deny]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
