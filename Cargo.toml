[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/shell", "crates/gui"]
# The fuzz targets are their own workspace, built with nightly and cargo-fuzz.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.10"
edition = "2024"
# sevenz-rust2 needs 1.93.
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xevrion/hatchzip"
homepage = "https://hatchzip.dev"

[workspace.dependencies]
hatchzip-core = { path = "crates/core", version = "0.1.10" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# `compress` is for the writer that `restore` builds a new header with. The
# decoders are chosen by `hatchzip-core`'s features, so the methods it
# accepts and the ones compiled in come from one place.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress"] }
tar = "0.4.46"
tempfile = "3.27.0"
zip = "9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decompression in an unoptimised build is slow enough to drag the test
# suite, and nobody steps through zstd in a debugger.
[profile.dev.package."*"]
opt-level = 2
debug = false

# ld 27 leaves the symbol string pool of a stripped proc-macro at an offset
# macOS 27's dyld refuses to load, and rustc reports the failed dlopen as
# "can't find crate" (rust-lang/rust#110536). This one is large enough to hit
# it. A proc-macro only runs at compile time and never ships, so strip it
# nowhere. The release profile strips everything, proc-macros included.
[profile.dev.package.slint-macros]
strip = "none"

[profile.release.build-override]
strip = false
