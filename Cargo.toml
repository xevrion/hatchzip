[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/shell", "crates/shell-ext", "crates/gui"]

[workspace.package]
version = "0.1.6"
edition = "2024"
# sevenz-rust2 needs 1.93.
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xevrion/hatchzip"
homepage = "https://hatchzip.dev"

[workspace.dependencies]
hatchzip-core = { path = "crates/core", version = "0.1.6" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Decoders, AES for password-protected archives, and `compress` for the
# writer that `restore` builds a new header with.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd", "zstd"] }
tar = "0.4.46"
tempfile = "3.27.0"
zip = "9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Decompression in an unoptimised build is slow enough to drag the test
# suite, and nobody steps through zstd in a debugger.
[profile.dev.package."*"]
opt-level = 2
debug = false
