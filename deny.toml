# cargo-deny: known vulnerabilities, licenses, banned crates and where crates
# come from. CI runs `cargo deny check` with and without `--features rar`;
# run the same locally:
#
#   cargo deny --locked check
#   cargo deny --locked --features rar check

[graph]
# The systems the releases are built for. Without this, crates that only
# build for targets nobody ships, such as wasm32 and UEFI, would count too.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# RustSec. Vulnerabilities, unsound and unmaintained crates fail the check by
# default; an entry here needs a reason next to it. All four below are
# "unmaintained" notices, not vulnerabilities, for crates that only the Linux
# build of the desktop app pulls in, through Slint's windowing layer. They go
# when Slint moves off them; remove each entry then.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, unmaintained: reads the system font for the Wayland title bar (winit's sctk-adwaita), never archive data" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, merged into zbus 6: D-Bus for accessibility on Linux (accesskit_unix, atspi), which is on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, merged into zbus 6: same path as zvariant" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, merged into zbus 6: same path as zvariant" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, unmaintained: used by spin_on inside slint-macros, a proc macro that runs at compile time and never sees archive data" },
]

[licenses]
# Every license in the tree today, all permissive. A new one fails the check
# until someone reads it and adds it here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    # libbz2-rs-sys, the bzip2 decoder for ZIP and 7z.
    "bzip2-1.0.6",
]
confidence-threshold = 0.93
exceptions = [
    # The UnRAR C++ source vendored by unrar-ng-sys, behind the `rar` feature
    # only. Freeware: free to extract RAR archives with, not to build a RAR
    # compatible archiver. See LICENSE-UNRAR.
    { crate = "unrar-ng-sys", allow = ["LicenseRef-UnRAR"] },
    # Slint, the GUI toolkit, offers GPL-3.0-only or its own licenses. The
    # desktop app uses it under the Royalty-free 2.0 license (crates/gui/README.md),
    # so GPL-3.0 stays out of the allow list.
    { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-build", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
]

# unrar-ng-sys declares only the license of its Rust bindings. The C++ it
# compiles is under the UnRAR license, so state both. The hash pins the
# vendored license text, identical to LICENSE-UNRAR. If a new version changes
# that text, cargo-deny quietly drops this clarification and the
# `--features rar` run warns that the UnRAR exception was not encountered.
# Read the new text, update LICENSE-UNRAR, then the hash: XxHash32, seed 0, of
# the file with `\n` line endings.
[[licenses.clarify]]
crate = "unrar-ng-sys"
expression = "(MIT OR Apache-2.0) AND LicenseRef-UnRAR"
license-files = [{ path = "vendor/unrar/license.txt", hash = 0x46456911 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The GUI pulls in the shell integration crate by path; neither is published.
allow-wildcard-paths = true

# HatchZip makes no network connections. These crates exist to talk to the
# network (HTTP clients and servers, TLS, sockets, QUIC, WebSockets), so any
# of them showing up in the tree, even as a transitive dependency of a GUI or
# decoder crate, fails CI until someone looks at why.
deny = [
    { crate = "reqwest", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "hyper", reason = "HTTP; HatchZip makes no network connections" },
    { crate = "hyper-util", reason = "HTTP; HatchZip makes no network connections" },
    { crate = "hyper-rustls", reason = "HTTPS; HatchZip makes no network connections" },
    { crate = "hyper-tls", reason = "HTTPS; HatchZip makes no network connections" },
    { crate = "h2", reason = "HTTP/2; HatchZip makes no network connections" },
    { crate = "h3", reason = "HTTP/3; HatchZip makes no network connections" },
    { crate = "quinn", reason = "QUIC; HatchZip makes no network connections" },
    { crate = "quinn-proto", reason = "QUIC; HatchZip makes no network connections" },
    { crate = "ureq", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "attohttpc", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "minreq", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "isahc", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "surf", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "curl", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "curl-sys", reason = "HTTP client; HatchZip makes no network connections" },
    { crate = "tiny_http", reason = "HTTP server; HatchZip makes no network connections" },
    { crate = "tungstenite", reason = "WebSockets; HatchZip makes no network connections" },
    { crate = "tokio-tungstenite", reason = "WebSockets; HatchZip makes no network connections" },
    { crate = "native-tls", reason = "TLS; HatchZip makes no network connections" },
    { crate = "openssl", reason = "TLS; HatchZip makes no network connections" },
    { crate = "openssl-sys", reason = "TLS; HatchZip makes no network connections" },
    { crate = "rustls", reason = "TLS; HatchZip makes no network connections" },
    { crate = "tokio-rustls", reason = "TLS; HatchZip makes no network connections" },
    { crate = "rustls-webpki", reason = "TLS; HatchZip makes no network connections" },
    { crate = "webpki-roots", reason = "TLS; HatchZip makes no network connections" },
    { crate = "socket2", reason = "sockets; HatchZip makes no network connections" },
    { crate = "async-net", reason = "sockets; HatchZip makes no network connections" },
    { crate = "async-std", reason = "async runtime with sockets; HatchZip makes no network connections" },
    { crate = "hickory-resolver", reason = "DNS; HatchZip makes no network connections" },
    { crate = "trust-dns-resolver", reason = "DNS; HatchZip makes no network connections" },
]

# tokio and mio are also event loops for files, timers and processes, which is
# fine. Their `net` feature is the part that opens sockets.
[[bans.features]]
crate = "tokio"
deny = ["net"]

[[bans.features]]
crate = "mio"
deny = ["net"]

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
